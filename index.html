<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6e1a6e" />
  <title>5차원 영어</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.png?v=9" type="image/png" />
  <link rel="apple-touch-icon" href="icon.png?v=9" />
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>
<div id="app">

  <!-- ===================== 홈 화면 ===================== -->
  <section id="screen-home" class="screen">
    <header class="app-header">
      <h1>5차원 영어</h1>
      <p class="tagline">동사 변형 · 문장 패턴 훈련</p>
    </header>

    <div class="track-toggle">
      <button class="track-btn active" data-track="basic">BASIC</button>
      <button class="track-btn" data-track="pattern">PATTERN</button>
      <button class="track-btn" data-track="root">ROOT</button>
    </div>

    <div id="overall-progress" class="overall"></div>

    <div class="settings">
      <label>🔊 발음 목소리</label>
      <div class="settings-row">
        <div class="voice-toggle">
          <button class="voice-btn" data-voice="female">여성</button>
          <button class="voice-btn" data-voice="male">남성</button>
        </div>
        <button id="btn-voice-test" class="speak-btn">테스트</button>
      </div>
      <p id="voice-tip" class="voice-tip"></p>

      <div class="settings-divider"></div>
      <label>🔀 카드 순서</label>
      <div class="order-toggle">
        <button class="order-btn" data-order="shuffle">무작위</button>
        <button class="order-btn" data-order="inorder">순서대로</button>
      </div>
      <p class="voice-tip">무작위로 풀면 순서를 외우지 않고 문장에 집중하게 됩니다.</p>
    </div>

    <!-- BASIC: 동사 목록 -->
    <div id="track-basic" class="track-panel">
      <p class="section-label">동사를 골라 시작하세요 · 11형태 × 의문사 7단계</p>
      <ul id="verb-list" class="verb-list"></ul>
    </div>

    <!-- PATTERN: 패턴 목록 -->
    <div id="track-pattern" class="track-panel hidden">
      <p class="section-label">교재 PATTERN DRILL · 4그룹 22패턴 · 문장 207개</p>
      <div id="pattern-list"></div>
    </div>

    <!-- ROOT: 어원 목록 -->
    <div id="track-root" class="track-panel hidden">
      <p class="section-label">어원 학습 · 접두사·접미사·라틴어·그리스어 76단위 · 단어 약 370개</p>
      <div id="root-list"></div>
    </div>

    <footer class="app-footer">
      <button id="btn-install" class="link-btn hidden">홈 화면에 앱 추가</button>
      <button id="btn-reset" class="link-btn">학습 기록 초기화</button>
    </footer>
  </section>

  <!-- ===================== 동사 → 단계 화면 (BASIC) ===================== -->
  <section id="screen-verb" class="screen hidden">
    <header class="sub-header">
      <button class="back-btn" data-back="home">‹ 동사 목록</button>
    </header>
    <div id="verb-hero" class="verb-hero"></div>
    <p class="section-label">7단계를 순서대로 익히세요</p>
    <ul id="step-list" class="step-list"></ul>
  </section>

  <!-- ===================== 드릴(플래시카드) 화면 ===================== -->
  <section id="screen-drill" class="screen hidden">
    <header class="drill-header">
      <button class="back-btn" data-back="drill-exit">‹ 나가기</button>
      <div class="drill-title">
        <span id="drill-main"></span>
        <span id="drill-sub"></span>
      </div>
    </header>
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <p id="progress-text" class="progress-text"></p>

    <div id="card" class="card">
      <div class="card-inner">
        <div class="card-face card-front">
          <span id="card-hint" class="card-hint"></span>
          <p id="card-ko" class="card-ko"></p>
          <span class="tap-hint">탭하면 정답이 보여요</span>
        </div>
        <div class="card-face card-back">
          <span id="card-back-hint" class="card-hint">English</span>
          <p id="card-en" class="card-en"></p>
          <div class="speak-row">
            <button id="btn-speak" class="speak-btn">🔊 듣기</button>
            <button id="btn-speak-slow" class="speak-btn">🐢 천천히</button>
          </div>
        </div>
      </div>
    </div>

    <div id="drill-actions" class="drill-actions hidden">
      <button id="btn-again" class="act-btn act-again">다시 · 모르겠어요</button>
      <button id="btn-known" class="act-btn act-known">알았어요 · 다음</button>
    </div>
    <div id="reveal-hint" class="reveal-hint">카드를 탭하세요</div>
  </section>

  <!-- ===================== 완료 화면 ===================== -->
  <section id="screen-done" class="screen hidden">
    <div class="done-box">
      <div class="done-star">⭐</div>
      <h2 id="done-title">완료!</h2>
      <p id="done-sub"></p>
      <div class="done-actions">
        <button id="btn-again-step" class="act-btn act-again">한 번 더</button>
        <button id="btn-next-step" class="act-btn act-known">다음</button>
      </div>
      <button id="btn-done-home" class="link-btn">목록으로</button>
    </div>
  </section>

</div>

<script src="data.js?v=15"></script>
<script src="patterns.js?v=15"></script>
<script src="roots.js?v=15"></script>
<script src="app.js?v=15"></script>
</body>
</html>
